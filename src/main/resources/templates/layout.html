<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle ?: 'Demarches Admin'}">Demarches Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-lg" th:if="${session.user != null}">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a th:href="@{/web/dashboard}" class="text-xl font-bold">Demarches Admin</a>
                    <a th:href="@{/web/dashboard}" class="hover:text-blue-200">Dashboard</a>
                    <a th:href="@{/web/demandes}" class="hover:text-blue-200">Demandes</a>
                    <a th:href="@{/web/demandes/creer}" class="hover:text-blue-200">Creer Demande</a>
                    <a th:href="@{/web/administrations}" class="hover:text-blue-200">Administrations</a>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm" th:text="${session.user?.prenom + ' ' + session.user?.nom}"></span>
                    <a th:href="@{/web/logout}" class="bg-blue-700 px-3 py-1 rounded hover:bg-blue-800">Deconnexion</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main class="max-w-7xl mx-auto py-6 px-4">
        <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            <span th:text="${error}"></span>
        </div>
        <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
            <span th:text="${success}"></span>
        </div>
        <div th:replace="~{:: content}"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-4 mt-8" th:if="${session.user != null}">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            &copy; 2024 Demarches Admin - Systeme de gestion des demarches administratives
        </div>
    </footer>

</body>
</html>
