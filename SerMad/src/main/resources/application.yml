server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/demarches_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: maSecretKeyPourJWTdemarchesAdministratives2024TresLongueEtSecurisee
  expiration: 86400000

logging:
  level:
    org.springframework.security: DEBUG