<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html}">
<body>

<div th:fragment="content">
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-gray-800">Dashboard Agent</h1>
        <p class="text-gray-600">Bienvenue, <span th:text="${#authentication.principal.prenom}"></span></p>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-3xl font-bold text-blue-600" th:text="${totalDemandes ?: 0}">0</div>
            <div class="text-gray-600">Total Demandes</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-3xl font-bold text-yellow-500" th:text="${enAttente ?: 0}">0</div>
            <div class="text-gray-600">En attente</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-3xl font-bold text-green-500" th:text="${terminees ?: 0}">0</div>
            <div class="text-gray-600">Terminees</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-3xl font-bold text-blue-500" th:text="${citoyens ?: 0}">0</div>
            <div class="text-gray-600">Citoyens</div>
        </div>
    </div>

    <!-- Actions rapides -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <a th:href="@{/web/demandes/creer}" class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition">
            <div class="text-blue-600 text-2xl mb-2">+</div>
            <h3 class="font-semibold text-gray-800">Creer une demande</h3>
            <p class="text-sm text-gray-600">Saisir les informations d'un citoyen</p>
        </a>
        <a th:href="@{/web/demandes}" class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition">
            <div class="text-green-600 text-2xl mb-2">=</div>
            <h3 class="font-semibold text-gray-800">Voir les demandes</h3>
            <p class="text-sm text-gray-600">Consulter et suivre les demandes</p>
        </a>
        <a th:href="@{/web/administrations}" class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition">
            <div class="text-purple-600 text-2xl mb-2">@</div>
            <h3 class="font-semibold text-gray-800">Administrations</h3>
            <p class="text-sm text-gray-600">Localiser les administrations</p>
        </a>
    </div>
</div>

</body>
</html>
